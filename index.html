<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyJaye Anas | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #111111;
            --text-secondary: #555555;
            --border-color: #000000;
            --card-bg: #f9f9f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Background Watermark/Illustration Style */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.04"><text x="10" y="50" font-family="serif" font-size="20">✂</text></svg>');
            pointer-events: none;
            z-index: 0;
        }

        /* Top Header & Navigation */
        header {
            border-bottom: 2px solid var(--border-color);
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2rem 2rem;
        }

        nav {
            display: flex;
            gap: 2.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav button {
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-primary);
            cursor: pointer;
            text-transform: uppercase;
            padding-bottom: 4px;
            transition: opacity 0.2s;
        }

        nav button:hover, nav button.active {
            opacity: 0.6;
            border-bottom: 2px solid var(--border-color);
        }

        /* Page Container */
        .page-content {
            display: none;
            flex: 1;
            padding: 4rem 5%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            z-index: 1;
            animation: fadeIn 0.4s ease-in-out;
        }

        .page-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Subpage Header Button Styling (Matching Wix Screenshots top-right buttons) */
        .subpage-btn-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 2rem;
        }

        .corner-nav-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.5rem;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-style: italic;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .corner-nav-btn:hover {
            background: var(--text-primary);
            color: var(--bg-color);
        }

        /* SECTION 1: HOMEPAGE */
        .home-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-top: 1rem;
        }
